androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation={group="androidx.navigation",name="navigation-compose",version.ref="nav_version"}
kotlinx-serialization-json={group="org.jetbrains.kotlinx",name="kotlinx-serialization-json",version="1.7.3"}
androidx-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "animation" }
locationServices={group="com.google.android.gms",name="play-services-location",version="21.3.0"}
retrofit={group="com.squareup.retrofit2",name="retrofit",version="3.0.0"}
converter-gson={group="com.squareup.retrofit2",name="converter-gson",version="2.9.0"}
lifecycle-viewmodel-compose-android={group="androidx.lifecycle",name="lifecycle-viewmodel-compose-android",version="2.8.7"}
room-kts={group="androidx.room",name="room-ktx",version.ref="room_version"}
room-runtime={group="androidx.room",name="room-runtime",version.ref="room_version"}
compose={group="com.github.bumptech.glide",name="compose",version="1.0.0-beta01"}
room-compiler={group="androidx.room",name="room-compiler",version="2.8.4"}
androidx-ui-geometry = { group = "androidx.compose.ui", name = "ui-geometry", version.ref = "uiGeometry" }
data-store-preferences={group="androidx.datastore" ,name="datastore-preferences",version="1.0.0"}
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
lottie-compose={group="com.airbnb.android",name="lottie-compose",version="6.4.0"}
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version = "0.12.1" }
compose-material-dialogs={group="io.github.vanpra.compose-material-dialogs", name = "datetime",version="0.9.0"}
work-runtime-ktx={group="androidx.work",name="work-runtime-ktx",version="2.9.0"}
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

